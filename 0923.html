<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐러셀 효과</title>
    <style>
        *{margin: 0; padding: 0;}
        ul{list-style: none;}

        .carousel{
            width: 1000px;

            margin: 300px auto;
            overflow: hidden;
            background-color: aliceblue;

            position: relative;
        }
        .panel{
            display: flex;
            width: 3000px;
        }
        .panel>li{
            flex-shrink: 0;
            width: 1000px;
            height: 300px;
            font-size: 4.5em;
            line-height: 4em;
            text-align: center;
        }
        .panel>li:nth-child(1){background-color: aqua;}
        .panel>li:nth-child(2){background-color: rgb(24, 173, 173);}
        .panel>li:nth-child(3){background-color: rgb(27, 69, 69);}

        .btn{}
        .btn>li{
            width: 40px;
            height: 40px;
            background-color: bisque;
            line-height: 40px;
            text-align: center;

            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            cursor: pointer;
        }
        .btn .prev{left:30px;}
        .btn .next{right: 30px;}
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            let wid =$(".carousel").width(); //wid =1000;
            let i = 0; 
            let count = $(".panel>li").length; //count = 3;
            
            $(".next").click(function(){
                if(i == count -1){
                    i = 0;
                }else{
                    i++;
                }
                $(".panel").stop().animate({"margin-left" : -wid * i});
            });

            $(".prev").click(function(){
                if(i == 0){
                    i = count -1;
                }else{
                    i--;
                }
                $(".panel").stop().animate({"margin-left" : -wid * i});
            });

            setInterval(function(){
                if(i == count -1){
                    i = 0;
                }else{
                    i++;
                }
                $(".panel").stop().animate({"margin-left" : -wid * i});
            }, 2000);
        });
    </script>
</head>
<body>
    <div class="carousel">
        <ul class="panel">
            <li>001</li>
            <li>002</li>
            <li>003</li>
        </ul>
        <ul class="btn">
            <li class="prev">prev</li>
            <li class="next">naxt</li>
        </ul>
    </div>
</body>
</html>
