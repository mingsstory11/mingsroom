<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이드인/아웃 활용하기</title>
  <style>
    *{margin: 0;padding: 0;}
    ul{list-style: none;}
    

    .mainBanner{
      width: 1200px;
      height: 500px;
      margin: 0 auto;
      position: relative;
    }
    .mainBanner .imgBox{
      width: 100%;
      
    }
    .mainBanner .imgBox>li{
      width: 1200px;
      height: 500px;
      font-size: 5em;
      text-align: center;
      position: absolute;
      left: 0; top: 0;
      /* 모두 안 보이게 처리함 */
      display: none;
    }

    .mainBanner .imgBox>li:nth-child(1){
      /* 1번만 보이게 해준다 */
      display: block;
      background-color: rgb(250, 182, 220);}


    .mainBanner .imgBox>li:nth-child(2){background-color: rgb(149, 245, 151);}
    .mainBanner .imgBox>li:nth-child(3){background-color: rgb(101, 234, 246);}

    .mainBanner p{
      position: absolute;
      top: 50%;
      /* transform: translateY(-50%); */
      width: 50px;
      height: 50px;
      border-top: 3px solid black;
      cursor: pointer;
    }
    .mainBanner .prev{
      left: 100px;
      border-left: 3px solid black;
      transform:translateY(-50%) rotate(-45deg);
    }
    .mainBanner .next{
      right: 100px;
      border-right: 3px solid black;
      transform:translateY(-50%) rotate(45deg);
    }
    .mainBanner .indicator{
      position: absolute;
      left: 50%; bottom:30px ;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    .mainBanner .indicator>li{
      width: 20px;
      height: 20px;
      border-radius: 20px;
      background-color: rgb(223, 223, 223);
      cursor: pointer;
      transition: all 0.3s;
    }
    .mainBanner .indicator>li:hover,
    .mainBanner .indicator>li.current{
      width: 70px;
      background-color: aliceblue;
    }



  </style>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>
    $(document).ready(function(){
        let i = 0;  //위치값
        let count = $(".imgBox>li").length;  // 개수

      $(".next").click(function(){

        if(i == count-1){
            i = 0;
        }else{
          i++;    //i = i + 1;
        }
        $(".imgBox>li").stop().fadeOut();
        $(".imgBox>li").eq(i).stop().fadeIn();

        $(".indicator>li").removeClass("current");
        $(".indicator>li").eq(i).addClass("current");
      });


      $(".prev").click(function(){
        if(i == 0){
          i = count -1;
        }else{
          i--;
        }
        $(".imgBox>li").stop().fadeOut();
        $(".imgBox>li").eq(i).fadeIn();
        $(".indicator>li").removeClass("current");
        $(".indicator>li").eq(i).addClass("current");
      });


      $(".indicator>li").click(function(){
        i = $(this).index();
        $(".imgBox>li").stop().fadeOut();
        $(".imgBox>li").eq(i).fadeIn();

        $(".indicator>li").removeClass("current");
        $(".indicator>li").eq(i).addClass("current");
      });
  });



  </script>
</head>
<body>
  <div class="mainBanner">
    <ul class="imgBox">
      <li>001</li>
      <li>002</li>
      <li>003</li>
    </ul>
    <p class="prev"></p>
    <p class="next"></p>

    <ul class="indicator">
      <li class="current"></li>
      <li></li>
      <li></li>
    </ul>
  </div>
</body>
</html>
