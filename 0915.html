<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탭메뉴 실습</title>
  <style>
    *{margin: 0; padding: 0;}
    ul{list-style: none;}

    .tab-section{
      width: 800px; 
      margin: 0 auto;
      /* background-color: antiquewhite; */
    }
    .tab-menu{
      display: flex;
    }

    .tab-menu li{
      width: calc(800px / 3);
      height: 70px;
      line-height: 70px;
      text-align: center;
      /* border: 1px solid red; */
      background-color: gray;
      border-bottom: 3px solid black;
      font-size: 1.2em;
      cursor: pointer;
    }
    .tab-menu li.active{
      background-color: black;
      color: #fff;
      font-weight: bold;
    }
    .tab-menu li:hover{
      background-color: rgb(50, 50, 50);
      color: #fff;
    }

      .tab-content{
        height: 250px;
        background-color: rgb(234, 233, 231);
        border: 1px solid #ccc;
        border-top: none;
        /* padding: 40px; */
        position: relative;
      }

        .tab-content li{
          position: absolute;
          top: 40px; left: 40px;
          display: none;
        }

        .tab-content li:nth-child(1){
          display: block;
        }

        .tab-content h2{
          margin-bottom: 20px;
          font-size: 1.8em;
        }

        .tab-content p{
          color: #555;
          font-size: 1.1em;
        }


        

  
  </style>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>
    $(document).ready(function(){
      $(".tab-menu li").click(function(){
        let num = $(this).index();

        $(".tab-menu li").removeClass(".active");
        $(this).addClass("active");

        $(".tab-content li").hide();
        $(".tab-content li").eq(num).show();


      });
    });
  </script>
</head>
<body>
  <div class="tab-section">
    <ul class="tab-menu">
      <li class="active">회사소개</li>
      <li>사업분야</li>
      <li>고객지원</li>
    </ul>
    <ul class="tab-content">
      <li>
        <h2>회사소개</h2>
        <p>
          고객의 더 나은 내일을 위해 끊임없이 연구하고 성장하는 기업입니다. 최고의 서비스와 기술력으로 고객의 성공을 함께 만들어갑니다.
        </p>
      </li>
      <li>
        <h2>사업분야</h2>
        <p>
          웹사이트 제작, UI/UX 디자인, 디지털 마케팅 등 다양한 분야에서 고객에게 최적화된 서비스를 제공합니다.
        </p>
      </li>
      <li>
        <h2>고객지원</h2>
        <p>
          서비스 이용에 궁금한 점이 있으신가요? 문의를 남겨주시면 친절하고 신속하게 안내해 드립니다.
        </p>
      </li>
    </ul>
  </div>
</body>
</html>
