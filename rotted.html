<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gnb 예제1 노티드</title>
  <style>
    *{margin: 0; padding: 0;}
    ul{list-style: none;}
    a{text-decoration: none; color: black;}

    header{
      width: 100%;
      /* background-color: rgb(252, 208, 215); */
      position: relative;
    }
    .header-inner{
      width: 1200px;
      height: 100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
    }
    .header-inner img{
      width: 200px;
      height: 70px;
    }
    .gnb{
      display:flex;
    }
    .gnb .main-my{
      display: flex;
      gap: 20px;
      margin-left: 40px;
      align-items: center;
    }
    .gnb .main-my>li>a{
      color: rgb(159, 159, 159);
    }
    .gnb .main-menu{
      display: flex;
      align-items: center;
      margin-left:60px;
    }
    .main-menu>li{
      width: 120px;
      height: 50px;
      text-align: center;
      line-height: 50px;
      /* border: 1px solid rgb(250, 25, 25); */
    }

    .gnb .sub-menu-wrap{
      /* display: none; */
      width: 100%;
      height: 170px;
      position: absolute;
      top: 85px; left: 0;
      background-color: #fff;
    }

    .gnb:hover .sub-menu-wrap{
      /* display: block; */
    }

    .gnb .sub-menu-wrap .sub-menu-inner{
      width: 850px;
      display: flex;
      /* gap: 10px; */
      line-height: 40px;
      margin-left: 365px;
      text-align: center;
      /* background-color: aqua; */
    }
    .gnb .sub-menu-wrap .sub-menu-inner .sub-menu{
      width: 120px;
    }
    .gnb .sub-menu-wrap .sub-menu-inner:nth-child(2){
      margin-left: -2px;
    }
    .gnb .sub-menu-wrap .sub-menu-inner:nth-child(4){
      margin-left: -6px;
    }
    .sub-menu{
      width: 120px;
    }
    .sub-menu>li>a{
      color: rgb(204, 206, 206);
    }
    .main-hero{
      background-image: url(krotted_hero.jpg);
      background-size: cover;
      height: 565px;
      width: 1320px;
      margin: 10px auto;
      border-radius: 20px;
    }






  </style>
  <!-- <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script> -->
  <script>
    $(document).ready(function(){
      $(".gnb").mouseenter(function(){
        $(".sub-menu-wrap").stop().slideDown();
      });
      $(".gnb").mouseleave(function(){
        $(".sub-menu-wrap").stop().slideUp();
      });


    })



  </script>
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="krotted_logo.png" alt="로고">
      <nav class="gnb">
        <ul class="main-menu">
          <li><a href="#">Online Shop</a></li>
          <li><a href="#">Reservation</a></li>
          <li><a href="#">Menu</a></li>
          <li><a href="#">Event</a></li>
          <li><a href="#">Brand</a></li>
          <li><a href="#">Help</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        
        <div class="sub-menu-wrap">
          <div class="sub-menu-inner">
            <ul class="sub-menu">
              <li><a href="#">푸드</a></li>
              <li><a href="#">리빙</a></li>
              <li><a href="#">창고대방출</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">픽업 예약</a></li>
              <li><a href="#">대량 주문</a></li>
              <li><a href="#">매장안내</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">메뉴 소개</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">이벤트</a></li>
              <li><a href="#">공지사항</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">스토리</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">자주 묻는 질문</a></li>
              <li><a href="#">1:1 문의</a></li>
            </ul>
            <ul class="sub-menu">
              <li><a href="#">제안하기</a></li>
              <li><a href="#">채용안내</a></li>
            </ul>
            
          </div>
        </div>
        <ul class="main-my">
          <li><a href="#">Login</a></li>
          <li><a href="#">Cart</a></li>
        </ul>
      </nav>
    </div>  
  </header>
  <main>
    <div class="main-hero">
      <!-- <img src="krotted_hero.jpg" alt="메인히어로"> -->
    </div class="main-hero">
  </main>
  <footer></footer>
</body>
</html>
